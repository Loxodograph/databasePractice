<h1>Transactions</h1>

<form [formGroup]="transactionForm" (ngSubmit)="onSubmit()">
  <input formControlName="amount" placeholder="Amount" />
  <input formControlName="description" placeholder="Description" />
  <select formControlName="categoryId" id="categorySelect">
    <option value="1" selected>Food</option>
    <option value="2">Transportation</option>
  </select>
  <button type="submit">Submit</button>
</form>

<h2>List all Transactions</h2>
<button (click)="transactionList()">List Transactions</button>

<ul *ngFor="let transaction of transactions(); let i = index">
  <li>
    {{i + 1}}: {{transaction.date}} - ${{transaction.amount}} <br>
    {{ categories()[transaction.categoryId - 1]?.name }} - {{transaction.description}}
    <button (click)="deleteTransaction(transaction.id)">X</button>
  </li>
 
</ul>
